[project]
name = "paretodo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "polars>=1.40.0",
    "pymoo>=0.6.1.6",
    "pyswarms>=1.3.0",
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paretodo*"]

[dependency-groups]
dev = ["black>=26.3.1", "mypy>=1.20.1", "pylint>=4.0.5", "pytest>=9.0.3"]
