name: Pylint Linting

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync environment
        run: uv sync --dev
        
      - name: Install package
        run: uv pip install -e .

      - name: src lint
        run: uv run pylint src --disable=R

      - name: tests lint
        run: uv run pylint tests --disable=R


    
