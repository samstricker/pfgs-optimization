[parameters]
name = "hb_llm"
problem = "himmelblau"
algorithm = "pfgs"
initial_samples = 5
sampling_mode = "llm_selector"
n_iterations = 95
batch_size = 1
seed = 5
meshgrid_points_per_dim = 20

[parameters.nsga2_config]
robustness_confidence = 0.95
pop_size_per_dim = 50
n_max_gen = 200
seed = 11

[parameters.discard_values]

[parameters.llm]
provider = "random"
p_invalid = 0.0
model = "qwen3.5:2b"
base_url = "http://localhost:11434/v1"
n_votes = 1
max_calls = 1
threshold = 0.51

[parameters.llm.options]
# temperature = 0

[files]
investigation_space = "research/.local/himmelblau/is_llm.json"
optimization_problem = "research/.local/himmelblau/op_llm.json"
testsets = [
    "research/.local/himmelblau/testset_full.csv",
    "research/.local/himmelblau/testset_objective.csv"
]
prompt = "research/prompts/selector_v1.md"
